<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">DepSlips deposit-slip template</title>
  <desc id="desc">Reusable neutral deposit-slip template with labeled content areas.</desc>
  <rect width="1200" height="550" fill="#F6F6ED"/>
  <rect x="24" y="24" width="1120" height="502" fill="none" stroke="#B8B8AE" stroke-width="2"/>
  <path d="M1144 0v550" stroke="#B8B8AE" stroke-width="2" stroke-dasharray="6 12"/>
  <rect x="82" y="70" width="140" height="120" fill="#F8F8F0" stroke="#282A25" stroke-width="2"/>
  <text x="104" y="130" fill="#202536" font-family="Arial, sans-serif" font-size="27" font-weight="800">SRC</text>
  <text x="98" y="160" fill="#202536" font-family="Arial, sans-serif" font-size="27" font-weight="800">LOGO</text>
  <text x="258" y="82" fill="#161714" font-family="Georgia, serif" font-size="26" font-weight="700">SRC CLEARING &amp; CO.</text>
  <text x="258" y="114" fill="#161714" font-family="Arial, sans-serif" font-size="17" font-weight="700">ATTN: MAIL-IN DEPOSITS</text>
  <text x="258" y="143" fill="#161714" font-family="Arial, sans-serif" font-size="17">PO BOX 12345</text>
  <text x="258" y="170" fill="#161714" font-family="Arial, sans-serif" font-size="17">NEW YORK, NY 10116-1234</text>
  <rect x="785" y="70" width="300" height="120" fill="#F8F8F0" stroke="#282A25" stroke-width="2"/>
  <path d="M785 110h300M785 150h300M940 70v120" stroke="#282A25" stroke-width="2"/>
  <text x="800" y="96" fill="#161714" font-family="monospace" font-size="13">DATE:</text>
  <text x="955" y="96" fill="#161714" font-family="monospace" font-size="13">YYYY-MM-DD</text>
  <text x="800" y="136" fill="#161714" font-family="monospace" font-size="13">ROUTING:</text>
  <text x="955" y="136" fill="#161714" font-family="monospace" font-size="13">000000000</text>
  <text x="800" y="176" fill="#161714" font-family="monospace" font-size="13">DDA:</text>
  <text x="955" y="176" fill="#161714" font-family="monospace" font-size="13">000000000000</text>
  <rect x="82" y="232" width="700" height="174" fill="#F8F8F0" stroke="#282A25" stroke-width="2"/>
  <path d="M82 282h700M82 340h700M300 282v58M525 282v58" stroke="#282A25" stroke-width="2"/>
  <text x="98" y="264" fill="#161714" font-family="Arial, sans-serif" font-size="14" font-weight="700">DEPOSIT TO (PAYEE):</text>
  <text x="98" y="306" fill="#161714" font-family="Arial, sans-serif" font-size="20" font-weight="700">PAYEE NAME</text>
  <text x="98" y="328" fill="#161714" font-family="monospace" font-size="11">CHECK NUMBER</text>
  <text x="316" y="328" fill="#161714" font-family="monospace" font-size="11">CHECK DATE</text>
  <text x="541" y="328" fill="#161714" font-family="monospace" font-size="11">CHECK AMOUNT</text>
  <text x="98" y="364" fill="#161714" font-family="Arial, sans-serif" font-size="13" font-weight="700">REFERENCE / NOTE:</text>
  <text x="98" y="389" fill="#161714" font-family="Arial, sans-serif" font-size="15">Add a note or invoice reference</text>
  <rect x="835" y="300" width="250" height="106" fill="#F8F8F0" stroke="#282A25" stroke-width="2"/>
  <path d="M835 344h250" stroke="#282A25" stroke-width="2"/>
  <text x="852" y="328" fill="#161714" font-family="Arial, sans-serif" font-size="15" font-weight="700">TOTAL DEPOSIT</text>
  <text x="852" y="380" fill="#161714" font-family="monospace" font-size="22">$ 0.00</text>
  <text x="600" y="475" text-anchor="middle" fill="#202536" font-family="monospace" font-size="20" letter-spacing="5">A000000000A 000000000000C 00000D</text>
</svg>