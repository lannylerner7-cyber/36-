kind = "web"
previewPath = "/"
title = "Document Renderer"
description = "A print-accurate, non-negotiable financial form renderer with secure data entry, live preview, address lookup integration boundaries, and deterministic PDF export preparation."
version = "1.0.0"
id = "artifacts/document-renderer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20330

[services.development]
run = "pnpm --filter @workspace/document-renderer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/document-renderer", "run", "build" ]
serve = "static"
publicDir = "artifacts/document-renderer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20330"
BASE_PATH = "/"
